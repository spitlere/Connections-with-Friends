<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Connections</title>
  
  <!-- iOS Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Connections">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nyt: {
              yellow: '#F9DF6D',
              green: '#A0C35A',
              blue: '#B0C4EF',
              purple: '#BA81C5',
              selected: '#5a594e',
              dark: '#121213',
              border: '#E2E2E2'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600;700&display=swap');
    html, body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #121213;
      user-select: none;
      -webkit-user-select: none;
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }
    .serif-font {
      font-family: 'Libre+Baskerville', serif;
    }
    /* Bounce animation for shaking incorrect guess */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
    /* Pop animation */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: pop 0.25s ease-in-out;
    }
  </style>
</head>
<body class="flex flex-col bg-white text-gray-900 antialiased">

  <!-- Top Navigation Bar with iOS Safe Area Top Clearance -->
  <header class="border-b border-gray-200 px-3 py-2 flex items-center justify-between bg-white sticky top-0 z-50" style="padding-top: max(0.5rem, env(safe-area-inset-top));">
    <div class="flex items-center space-x-2">
      <button onclick="switchView('play')" class="p-1.5 text-gray-600 hover:text-black rounded-lg transition" title="Play Game">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>
      <button onclick="switchView('create')" class="p-1.5 text-gray-600 hover:text-black rounded-lg transition" title="Board Builder">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      </button>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openImportModal()" class="text-xs px-3 py-1.5 bg-gray-100 hover:bg-gray-200 font-medium rounded-full transition text-gray-700">Import Board</button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 py-2 flex flex-col justify-center overflow-hidden">

    <!-- VIEW 1: PLAY GAME -->
    <div id="view-play" class="flex flex-col justify-center h-full max-h-[720px]">
      <div class="my-auto">
        <!-- Solved Categories Container -->
        <div id="solved-categories" class="space-y-2 mb-2">
          <!-- Dynamically injected solved rows -->
        </div>

        <!-- 4x4 Game Grid -->
        <div id="game-grid" class="grid grid-cols-4 gap-2 mb-4">
          <!-- Dynamically generated word tiles -->
        </div>
      </div>

      <!-- Controls & Mistakes Tracker -->
      <div class="space-y-3 pb-2 mt-auto">
        <div id="mistakes-container" class="flex items-center justify-center space-x-2 text-xs font-medium text-gray-700">
          <span>Mistakes remaining:</span>
          <div id="mistake-dots" class="flex space-x-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-gray-400 inline-block"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-gray-400 inline-block"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-gray-400 inline-block"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-gray-400 inline-block"></span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button onclick="shuffleGrid()" class="py-2.5 px-3 border border-black rounded-full font-bold text-[11px] uppercase tracking-wider hover:bg-gray-50 transition active:scale-95">Shuffle</button>
          <button onclick="deselectAll()" class="py-2.5 px-3 border border-black rounded-full font-bold text-[11px] uppercase tracking-wider hover:bg-gray-50 transition active:scale-95">Deselect All</button>
          <button id="submit-btn" onclick="submitGuess()" disabled class="py-2.5 px-3 bg-gray-200 text-gray-400 rounded-full font-bold text-[11px] uppercase tracking-wider transition cursor-not-allowed">Submit</button>
        </div>
      </div>
    </div>


    <!-- VIEW 2: BOARD BUILDER (CREATE) -->
    <div id="view-create" class="hidden flex-1 flex flex-col h-full overflow-hidden py-2">
      <div class="mb-2">
        <h2 class="serif-font text-lg font-bold tracking-tight">Board Builder</h2>
        <p class="text-[11px] text-gray-500">Design a private puzzle. Answers remain encrypted when shared!</p>
      </div>

      <div class="space-y-3 flex-1 overflow-y-auto pr-1 pb-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-600 mb-1">Puzzle Title</label>
          <input type="text" id="builder-title" placeholder="e.g. Sarah's Birthday Challenge" class="w-full px-3 py-1.5 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-600 mb-1">Creator Name</label>
          <input type="text" id="builder-author" placeholder="e.g. Alex" class="w-full px-3 py-1.5 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <!-- Category 1: Yellow (Straightforward) -->
        <div class="p-2.5 rounded-xl bg-nyt-yellow/20 border border-nyt-yellow/50 space-y-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-yellow-800">Yellow Category (Easy)</span>
          <input type="text" id="cat-0-name" placeholder="Category Name (e.g., TYPES OF FISH)" class="w-full px-2.5 py-1 text-xs bg-white border border-gray-300 rounded-md">
          <div class="grid grid-cols-2 gap-1.5">
            <input type="text" id="cat-0-w-0" placeholder="Word 1" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-0-w-1" placeholder="Word 2" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-0-w-2" placeholder="Word 3" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-0-w-3" placeholder="Word 4" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
          </div>
        </div>

        <!-- Category 2: Green (Medium) -->
        <div class="p-2.5 rounded-xl bg-nyt-green/20 border border-nyt-green/50 space-y-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-green-800">Green Category (Medium)</span>
          <input type="text" id="cat-1-name" placeholder="Category Name (e.g., GARDEN TOOLS)" class="w-full px-2.5 py-1 text-xs bg-white border border-gray-300 rounded-md">
          <div class="grid grid-cols-2 gap-1.5">
            <input type="text" id="cat-1-w-0" placeholder="Word 1" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-1-w-1" placeholder="Word 2" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-1-w-2" placeholder="Word 3" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-1-w-3" placeholder="Word 4" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
          </div>
        </div>

        <!-- Category 3: Blue (Tricky) -->
        <div class="p-2.5 rounded-xl bg-nyt-blue/20 border border-nyt-blue/50 space-y-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-blue-800">Blue Category (Tricky)</span>
          <input type="text" id="cat-2-name" placeholder="Category Name (e.g., ___ BOWLING)" class="w-full px-2.5 py-1 text-xs bg-white border border-gray-300 rounded-md">
          <div class="grid grid-cols-2 gap-1.5">
            <input type="text" id="cat-2-w-0" placeholder="Word 1" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-2-w-1" placeholder="Word 2" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-2-w-2" placeholder="Word 3" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-2-w-3" placeholder="Word 4" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
          </div>
        </div>

        <!-- Category 4: Purple (Hardest) -->
        <div class="p-2.5 rounded-xl bg-nyt-purple/20 border border-nyt-purple/50 space-y-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-purple-900">Purple Category (Hardest)</span>
          <input type="text" id="cat-3-name" placeholder="Category Name (e.g., SILENT LETTERS)" class="w-full px-2.5 py-1 text-xs bg-white border border-gray-300 rounded-md">
          <div class="grid grid-cols-2 gap-1.5">
            <input type="text" id="cat-3-w-0" placeholder="Word 1" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-3-w-1" placeholder="Word 2" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-3-w-2" placeholder="Word 3" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
            <input type="text" id="cat-3-w-3" placeholder="Word 4" class="px-2 py-1 text-xs bg-white border border-gray-300 rounded-md">
          </div>
        </div>

        <button onclick="generateAndShareBoard()" class="w-full py-3 bg-black text-white rounded-full font-bold text-xs uppercase tracking-wider hover:bg-gray-800 transition active:scale-95 shadow-sm mt-2">Share Board</button>
      </div>
    </div>

  </main>

  <!-- Toast Notification Overlay -->
  <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 bg-black text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 font-medium"></div>

  <!-- Import Modal -->
  <div id="import-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
      <h3 class="serif-font text-base font-bold">Import Puzzle Board</h3>
      <p class="text-xs text-gray-500">Paste the puzzle link/code sent by your friend, or upload their puzzle file.</p>
      
      <textarea id="import-code-input" rows="3" placeholder="Paste encrypted puzzle code or URL here..." class="w-full p-2.5 text-xs border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black"></textarea>
      
      <div>
        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Or upload puzzle file (.json / .nytconn):</label>
        <input type="file" id="import-file-input" accept=".json,.nytconn" onchange="handleFileUpload(event)" class="
